name: Benchmark Dispatch
on:
  push:
    branches:
      - 'bench/**'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: dart pub get
      - name: Run benchmark command
        run: |
          CMD=$(sed -n 's/^cmd=//p' .benchmarks/dispatch-*.txt | head -n1)
          echo "Command: $CMD"
          bash -lc "$CMD"
